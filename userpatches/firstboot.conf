# ArmLab WiFi: primer arranque SANITIZADO.
# No se hornean contrasenas, IP, WiFi ni claves: se piden en el primer arranque.

# Idioma y zona horaria del box original.
SET_LANG_BASED_ON_LOCATION="n"
PRESET_LOCALE="es_ES.UTF-8"
PRESET_TIMEZONE="Europe/Madrid"

# Red: sin cambios, DHCP por defecto. Sin SSID ni IP fija.
PRESET_NET_CHANGE_DEFAULTS="0"

# Nombre de usuario del escritorio (el wizard pedira su contrasena).
PRESET_USER_NAME="diego"
PRESET_DEFAULT_REALNAME="ArmLab WiFi"
PRESET_USER_SHELL="bash"
