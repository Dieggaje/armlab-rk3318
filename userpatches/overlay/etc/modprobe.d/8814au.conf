# Mitigacion de consumo del RTL8814AU (4x4 -> 1 stream)
# rtw_tx_pwr_lmt_enable=0 evita el BUG de FORTIFY_SOURCE en
# rtw_txpwr_lmt_add_with_nlen (char regd_name[0]) del kernel 6.18
options 8814au rtw_tx_nss=1 rtw_rx_nss=1 rtw_ips_mode=0 rtw_lps_level=0 rtw_power_mgnt=0 rtw_tx_pwr_lmt_enable=0 rtw_tx_pwr_by_rate=0
